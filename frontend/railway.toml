# railway.toml — Configuração do deploy do Frontend no Railway
#
# O Railway lê este arquivo para saber como buildar e servir o frontend.

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"  # gera a pasta dist/

[deploy]
# Serve os arquivos estáticos gerados pelo build do Vite
# O $PORT é injetado automaticamente pelo Railway
startCommand = "npx serve dist --listen $PORT --single"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
